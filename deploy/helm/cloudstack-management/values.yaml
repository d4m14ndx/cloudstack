# Default values for cloudstack-management.

replicaCount: 1

image:
  repository: ghcr.io/d4m14ndx/cloudstack-management
  pullPolicy: IfNotPresent
  tag: ""  # Overrides the image tag (defaults to the chart appVersion).

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# External MySQL connection details (set these for any non-toy deployment).
database:
  host: mysql.example.internal
  port: 3306
  name: cloud
  user: cloud
  # If using an existing Secret for the password:
  existingSecret: ""
  existingSecretKey: password
  # Or set a password literal (avoid in production):
  password: ""

# Logging — set to "json" for ECS-formatted structured logs (consumed by Loki / ELK / Datadog).
logFormat: text

# JVM memory settings.
javaOpts: "-Xmx2g -Xms512m"

# OpenTelemetry tracing — set endpoint + exporter to enable distributed traces.
tracing:
  enabled: false
  serviceName: cloudstack-management
  exporter: otlp            # set to "none" to disable
  endpoint: ""              # e.g. http://otel-collector.observability:4318
  protocol: http/protobuf
  samplerRatio: "0.1"

service:
  type: ClusterIP
  httpPort: 8080
  httpsPort: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/proxy-body-size: 16m
  hosts:
    - host: cloudstack.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: cloudstack-tls
    #   hosts:
    #     - cloudstack.example.com

# Prometheus scraping. The Phase 4 /metrics endpoint emits JVM, process,
# and HTTP metrics. A PodMonitor/ServiceMonitor for Prometheus Operator
# is created when `serviceMonitor.enabled=true`.
serviceMonitor:
  enabled: false
  namespace: ""           # leave empty to install in release namespace
  labels: {}              # extra labels for the ServiceMonitor (e.g. release: kube-prometheus-stack)
  interval: 30s
  scrapeTimeout: 10s

# Pod-level Prometheus annotations (used by simpler scrape configs).
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /client/metrics
  prometheus.io/port: "8080"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false   # CloudStack writes to /var/lib/cloudstack at runtime

# Probe paths target the Phase 4 health endpoints.
livenessProbe:
  httpGet:
    path: /client/health/live
    port: http
  initialDelaySeconds: 120
  periodSeconds: 20
  failureThreshold: 5
readinessProbe:
  httpGet:
    path: /client/health/ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /client/health/live
    port: http
  failureThreshold: 60
  periodSeconds: 5

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}

extraEnv: []
  # - name: SOMETHING
  #   value: somevalue

# Mount your own server.properties / db.properties from a ConfigMap.
configOverride:
  enabled: false
  serverPropertiesConfigMap: ""    # ConfigMap key: server.properties
  dbPropertiesConfigMap: ""        # ConfigMap key: db.properties
