name: web

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'docker-compose.yml'
  push:
    branches:
      - modernize-2026
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'docker-compose.yml'

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check Docker Compose config
        working-directory: .
        run: docker compose -f docker-compose.yml config

      - name: Build Docker image
        working-directory: .
        run: docker build -t cloudstack-web ./web
