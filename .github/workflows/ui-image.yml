# Phase 5a: UI container image build
#
# Triggers on any change under ui/** — completely independent of the
# Java/Maven build so it can finish in ~3 minutes on a small runner.
#
# Images are tagged:   ghcr.io/<owner>/cloudstack-ui:<branch>-<sha7>
#                      ghcr.io/<owner>/cloudstack-ui:latest   (main only)
#
# TODO: replace the GHCR org below with your fork's GitHub org once you
#       have configured GHCR_TOKEN as a repo secret.

name: "Phase 5a – UI image"

on:
  push:
    branches:
      - "modernize-2026**"
      - "main"
    paths:
      - "ui/**"
      - ".github/workflows/ui-image.yml"
  pull_request:
    branches:
      - "modernize-2026**"
      - "main"
    paths:
      - "ui/**"
      - ".github/workflows/ui-image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # needed to push to GHCR

env:
  REGISTRY: ghcr.io
  # TODO: set IMAGE_NAME to your fork org, e.g. ghcr.io/myorg/cloudstack-ui
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cloudstack-ui

jobs:
  build-ui-image:
    name: "Build UI Docker image"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Upgrade the UI Dockerfile's Node base to 20 at build time via
      # --build-arg so we do not have to touch the committed Dockerfile yet.
      # TODO: update ui/Dockerfile FROM node:14-bullseye → node:20-bookworm
      #       once this workflow proves stable, then drop the build-arg.
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # branch + short-SHA on every push/PR
            type=sha,prefix=${{ github.ref_name }}-,format=short
            # semver tags from Git tags, e.g. v4.22.0
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # "latest" only when pushing to main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # -----------------------------------------------------------------------
      # Pre-merge: image is BUILT (cache populated) but NOT pushed.
      # Post-merge: the push step is also enabled.
      # -----------------------------------------------------------------------

      # Pre-merge block — always runs (build + cache, no push)
      - name: Build UI image (PR — no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: false
          # Override the node base image version via build-arg
          # TODO: drop once ui/Dockerfile is updated to node:20
          build-args: |
            NODE_BASE=node:20-bookworm
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui-image
          cache-to: type=gha,mode=max,scope=ui-image

      # Post-merge block — runs on push to tracked branches, also logs in
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # TODO: configure GHCR_TOKEN secret in repo settings
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push UI image (post-merge)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          build-args: |
            NODE_BASE=node:20-bookworm
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui-image
          cache-to: type=gha,mode=max,scope=ui-image

      - name: Image digest
        if: github.event_name == 'push'
        run: echo "Pushed UI image digest ${{ steps.meta.outputs.version }}"
